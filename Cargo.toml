[package]
name = "lamina-sql"
version = "0.1.0"
edition = "2024"
default-run = "lamina"
license = "MIT"
description = "A small vectorized analytical SQL engine built from first principles"

[lib]
name = "lamina_sql"
path = "src/lib.rs"

[[bin]]
name = "lamina"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
proptest = "1.7"
rusqlite = { version = "0.38", features = ["bundled"] }

[profile.release]
debug = true
lto = "thin"
